name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Skip version bump commits to prevent infinite loop
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: bump version to') }}"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flatoutsolutions'

      - name: Enable Corepack
        run: corepack enable

      - name: Get next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor, docs, style, test, build, ci, chore, revert
          patchAll: true
          noVersionBumpBehavior: silent
          noNewCommitBehavior: silent

      - name: Install
        if: steps.semver.outputs.nextStrict != ''
        run: yarn install --immutable

      - name: Typecheck
        if: steps.semver.outputs.nextStrict != ''
        run: yarn tsc --noEmit

      - name: Test
        if: steps.semver.outputs.nextStrict != ''
        run: yarn test

      - name: Build
        if: steps.semver.outputs.nextStrict != ''
        run: yarn build

      - name: Update version in package.json
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.env.VERSION; fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');"

      - name: Publish
        if: steps.semver.outputs.nextStrict != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, tag, and push
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
          TAG: ${{ steps.semver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git tag "${TAG}"
          git push origin main --tags
