name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to release (e.g. 1.0.0). Leave empty to use commit-derived semver.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @flatoutsolutions/cccollab lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @flatoutsolutions/cccollab typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @flatoutsolutions/cccollab test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn workspace @flatoutsolutions/cccollab build

  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'chore: bump version to'))
    needs: [format, lint, typecheck, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@flatoutsolutions'

      - name: Enable Corepack
        run: corepack enable

      - name: Get next version (from commits)
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        id: semver_auto
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor, docs, style, test, build, ci, chore, revert
          patchAll: true
          noVersionBumpBehavior: silent
          noNewCommitBehavior: silent

      - name: Resolve release version
        id: semver
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
          AUTO_STRICT: ${{ steps.semver_auto.outputs.nextStrict }}
          AUTO_TAG: ${{ steps.semver_auto.outputs.next }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            # Validate strict semver (x.y.z) to prevent injection and bad tags.
            if ! printf '%s' "$EXPLICIT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: $EXPLICIT_VERSION (expected strict semver X.Y.Z)" >&2
              exit 1
            fi
            echo "nextStrict=$EXPLICIT_VERSION" >> "$GITHUB_OUTPUT"
            echo "next=v$EXPLICIT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "nextStrict=$AUTO_STRICT" >> "$GITHUB_OUTPUT"
            echo "next=$AUTO_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.semver.outputs.nextStrict != ''
        run: yarn install --immutable

      - name: Build
        if: steps.semver.outputs.nextStrict != ''
        run: yarn workspace @flatoutsolutions/cccollab build

      - name: Update version in mcp_server/package.json and plugin.json
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          node -e "const fs=require('fs'); for (const f of ['./mcp_server/package.json','./plugin/.claude-plugin/plugin.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=process.env.VERSION; fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n'); }"

      - name: Publish
        if: steps.semver.outputs.nextStrict != ''
        working-directory: mcp_server
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, tag, and push
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
          TAG: ${{ steps.semver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp_server/package.json plugin/.claude-plugin/plugin.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git tag "${TAG}"
          git push origin main --tags
