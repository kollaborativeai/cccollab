# CI & Release workflow for the cccollab monorepo.
#
# Pipeline shape:
#   Phase I   - Always-run checks (format, lint, typecheck, test, build) in parallel
#   Phase II  - Detect which paths changed (push and pull_request)
#   Phase III - release (npm publish + tag) when mcp_server/plugin paths changed
#   Phase IV  - deploy cccollab.dev when website/ changed; preview on same-repo PRs
#
# The two halves are independent: a website-only commit never publishes to npm,
# and an mcp_server-only commit never redeploys the site.
#
# -------------------------------------------------------------------
# Secrets/vars the workflow expects (provision in GitHub repo settings):
#
#   Publishing uses npm Trusted Publishing (OIDC), not a stored token. The
#   runner presents a short-lived identity token and npm exchanges it for
#   publish rights, so there is no NPM_TOKEN to leak, rotate, or expire. The
#   trusted publisher is configured on the package at npmjs.com and must name
#   this repository and this workflow file (ci.yml). npm does not validate that
#   configuration when it is saved, so a mismatch appears only as a failed
#   publish.
#
#   Secrets:
#     GITHUB_TOKEN - auto-provided by Actions; used for the version-bump
#                    commit/tag/push and the GitHub Release. No longer used
#                    for publishing.
#     TAP_GITHUB_TOKEN - OPTIONAL. A token with contents:write on
#                    kollaborativeai/homebrew-tap, used to bump the Homebrew
#                    formula after each publish. GITHUB_TOKEN cannot do this:
#                    it is scoped to this repository. When absent the tap
#                    step is skipped and the formula must be bumped by hand.
#     CLOUDFLARE_API_TOKEN - required by Phase IV. Cloudflare has no OIDC path
#                    for Pages, so unlike npm above this must be a long-lived
#                    token. Its permission (Account -> Cloudflare Pages -> Edit)
#                    cannot be narrowed to one project and therefore reaches
#                    every Pages project in the account, including the
#                    production kollaborativeai.com site. Use a dedicated token
#                    used by nothing else so it can be revoked without
#                    collateral. This repository is public; fork PRs receive no
#                    secrets, and `website-preview` is gated to same-repo PRs so
#                    it skips rather than fails for outside contributors.
#
#   Variables:
#     CLOUDFLARE_ACCOUNT_ID - Kollaborative AI account. Not a secret.
# -------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to release (e.g. 1.0.0). Leave empty to use commit-derived semver.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # ============================================
  # Phase I - CI checks (always run, in parallel)
  # ============================================
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Format check
        run: yarn format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Lint
        run: yarn lint
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Typecheck
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Run tests
        run: yarn test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Build
        run: yarn build

  # ============================================
  # Phase II - Detect which components changed
  # ============================================
  # Runs on pull_request as well as push: `website-preview` needs the filter
  # result on PRs. `release` gates on `github.event_name == 'push'` itself, so
  # running here on a PR cannot cause a publish.
  #
  # `changes` is a JSON array of the filter names that matched. Gate with
  # `contains(fromJSON(needs.detect-changes.outputs.changes), '<name>')`.
  detect-changes:
    needs: [format, lint, typecheck, test, build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: flatoutsolutions/github-actions/changes@v1
        with:
          filters: |
            mcp_server:
              - 'mcp_server/**'
              - 'plugin/**'
              - 'yarn.lock'
            website:
              - 'website/**'

  # DO NOT add `yarn.lock` (or any root-level dependency file) to the `website`
  # filter, and do not give `website/` a package.json that feeds the root
  # lockfile.
  #
  # `yarn.lock` is in the `mcp_server` filter so a transitive security bump to a
  # published dependency still ships a release. If website work could move the
  # root lockfile, adding a front-end dependency would fire the release job and
  # publish a new version of @kollaborativeai/cccollab whose only real change is
  # a marketing-site dependency. The site is deliberately plain HTML and CSS with
  # no build step and no dependencies, which keeps the two trees separate.

  # ============================================
  # Phase III - Release @kollaborativeai/cccollab to npmjs.com
  # ============================================
  # Gating:
  #   * Phase I jobs must have succeeded (explicit result checks because the
  #     outer `!cancelled()` relaxes the default success requirement).
  #   * On workflow_dispatch: always release (manual trigger, no path filter).
  #   * On push to main: require mcp_server paths to have changed and skip
  #     the auto-bump commit.
  release:
    needs: [format, lint, typecheck, test, build, detect-changes]
    if: |
      !cancelled() &&
      needs.format.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(fromJSON(needs.detect-changes.outputs.changes), 'mcp_server') &&
          !startsWith(github.event.head_commit.message, 'chore: bump version to')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Mints the short-lived OIDC token npm exchanges for publish rights.
      # Without this the publish fails with an auth error even when the
      # trusted publisher is configured correctly on npmjs.com.
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      # Trusted Publishing requires npm CLI >= 11.5.1. Rather than depend on
      # whatever ships with the runner's Node, upgrade only when it is older —
      # a version check is cheaper than an unconditional global install, and
      # failing here is far clearer than an opaque auth error at publish time.
      - name: Ensure npm supports Trusted Publishing
        run: |
          set -euo pipefail
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is older than $need; upgrading"
            npm install -g npm@latest
          fi
          npm --version

      - name: Get next version (from commits)
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        id: semver_auto
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor, docs, style, test, build, ci, chore, revert
          patchAll: true
          noVersionBumpBehavior: silent
          noNewCommitBehavior: silent

      - name: Resolve release version
        id: semver
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
          AUTO_STRICT: ${{ steps.semver_auto.outputs.nextStrict }}
          AUTO_TAG: ${{ steps.semver_auto.outputs.next }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            # Validate strict semver (x.y.z) to prevent injection and bad tags.
            if ! printf '%s' "$EXPLICIT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: $EXPLICIT_VERSION (expected strict semver X.Y.Z)" >&2
              exit 1
            fi
            echo "nextStrict=$EXPLICIT_VERSION" >> "$GITHUB_OUTPUT"
            echo "next=v$EXPLICIT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "nextStrict=$AUTO_STRICT" >> "$GITHUB_OUTPUT"
            echo "next=$AUTO_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.semver.outputs.nextStrict != ''
        run: yarn install --immutable

      - name: Build
        if: steps.semver.outputs.nextStrict != ''
        run: yarn workspace @kollaborativeai/cccollab build

      - name: Update version in mcp_server/package.json and plugin.json
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        # `JSON.stringify(_, null, 2)` always emits multi-line arrays, which
        # conflicts with Prettier's compact style for short arrays and breaks
        # the next non-skip CI run's `format:check`. Run prettier --write on
        # both files immediately after the rewrite to keep them conformant.
        run: |
          node -e "const fs=require('fs'); for (const f of ['./mcp_server/package.json','./plugin/.claude-plugin/plugin.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=process.env.VERSION; fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n'); }"
          npx prettier --write mcp_server/package.json plugin/.claude-plugin/plugin.json

      - name: Publish
        if: steps.semver.outputs.nextStrict != ''
        working-directory: mcp_server
        run: npm publish
        # No NODE_AUTH_TOKEN. Publishing authenticates via Trusted Publishing
        # (OIDC): the runner presents a short-lived identity token and npm
        # exchanges it for publish rights, so there is no stored credential to
        # leak, rotate, or expire. The trusted publisher is configured on the
        # package at npmjs.com and must name this repo and this workflow file.
        #
        # npm does not validate that configuration when it is saved, so a wrong
        # workflow filename surfaces only as a failed publish here.

      - name: Commit, tag, and push
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
          TAG: ${{ steps.semver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp_server/package.json plugin/.claude-plugin/plugin.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git tag "${TAG}"
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.semver.outputs.nextStrict != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.next }}
        # Auto-generate notes from PRs and commits since the previous tag.
        # Idempotent on retry: if the release already exists (manual rerun
        # of this job after a tag was created in a prior partial run), skip
        # creation rather than failing the whole job.
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

      # ------------------------------------------------------------------
      # Keep the Homebrew formula in step with the published package.
      #
      # Skipped when TAP_GITHUB_TOKEN is absent, so the release itself never
      # fails over tap automation. Without the secret the formula simply has
      # to be bumped by hand, which is a stale formula rather than a broken
      # release. GITHUB_TOKEN cannot be used here: it is scoped to this
      # repository and the tap is a different one.
      #
      # The sha256 is computed from the tarball npm actually served, not from
      # a local build, so the formula can only ever point at bytes that exist
      # on the registry.
      # ------------------------------------------------------------------
      - name: Update the Homebrew tap
        if: steps.semver.outputs.nextStrict != '' && env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          TARBALL="https://registry.npmjs.org/@kollaborativeai/cccollab/-/cccollab-${VERSION}.tgz"

          # npm's registry can lag a few minutes on a fresh publish. Fail the
          # step rather than write a sha256 for a tarball that is not there.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$TARBALL" -o /tmp/pkg.tgz; then break; fi
            echo "tarball not on the registry yet (attempt ${attempt}); waiting"
            sleep 20
          done
          test -s /tmp/pkg.tgz || { echo "::error::${TARBALL} never became available"; exit 1; }

          SHA=$(sha256sum /tmp/pkg.tgz | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/kollaborativeai/homebrew-tap.git" /tmp/tap
          cd /tmp/tap

          python3 - "$VERSION" "$SHA" <<'PY'
          import re, sys
          version, sha = sys.argv[1], sys.argv[2]
          path = "Formula/cccollab.rb"
          src = open(path).read()
          src = re.sub(r'cccollab-\d+\.\d+\.\d+\.tgz', f'cccollab-{version}.tgz', src)
          src = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', src)
          open(path, "w").write(src)
          PY

          if git diff --quiet; then
            echo "Formula already at ${VERSION}, nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: cccollab ${VERSION}"
          git push origin main

  # ============================================
  # Phase IV - Deploy cccollab.dev (website/ only)
  # ============================================
  # The site is static HTML/CSS with no build step, so there is nothing to
  # compile - the directory is uploaded as-is.
  #
  # Credential note: Cloudflare API tokens cannot be scoped to a single Pages
  # project; `Account -> Cloudflare Pages -> Edit` is account-level and reaches
  # every Pages project in the account. CLOUDFLARE_API_TOKEN should therefore be
  # a dedicated token used by nothing else, so it can be revoked without
  # collateral. Cloudflare Pages has no OIDC path for CI, so unlike the npm
  # publish above this cannot be a short-lived token.
  deploy-website:
    needs: [format, lint, typecheck, test, build, detect-changes]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(needs.detect-changes.outputs.changes), 'website')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # npm, not the repo's yarn. The action picks a package manager from
          # the lockfile and would shell out to the runner's global yarn 1.x,
          # which refuses to run because package.json pins yarn@4 via Corepack.
          # A static upload needs no repo dependencies, so npm sidesteps it.
          packageManager: npm
          wranglerVersion: '4.118.0'
          command: pages deploy website --project-name=cccollab --branch=main

  # Preview deploy for pull requests that touch the site.
  #
  # Gated on the PR coming from a branch in this repository: fork PRs receive no
  # secrets, so this job would fail rather than skip, and a red X on every
  # external contribution is a poor first impression on a public repo. Fork PRs
  # still get the full Phase I checks; they just do not get a preview URL.
  website-preview:
    needs: [format, lint, typecheck, test, build, detect-changes]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON(needs.detect-changes.outputs.changes), 'website')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.118.0'
          # Preview URLs are derived from the branch name. head_ref is only
          # interpolated into an action input here, never into a shell command.
          command: pages deploy website --project-name=cccollab --branch=${{ github.head_ref }}
