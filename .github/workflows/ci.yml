# CI & Release workflow for the cccollab monorepo.
#
# Pipeline shape:
#   Phase I   - Always-run checks (format, lint, typecheck, test, build) in parallel
#   Phase II  - Detect which paths changed via dorny/paths-filter (push-only)
#   Phase III - release-mcp (npm publish + tag) when mcp_server/plugin paths changed
#
# -------------------------------------------------------------------
# Secrets/vars the workflow expects (provision in GitHub repo settings):
#
#   Secrets:
#     NPM_TOKEN    - REQUIRED. An npmjs.com automation token with publish
#                    rights on the `cccollab` package. Without it the release
#                    job fails at `npm publish`. Not auto-provided: create it
#                    at npmjs.com and add it under Settings > Secrets > Actions.
#     GITHUB_TOKEN - auto-provided by Actions; used for the version-bump
#                    commit/tag/push and the GitHub Release. No longer used
#                    for publishing.
# -------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version to release (e.g. 1.0.0). Leave empty to use commit-derived semver.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # ============================================
  # Phase I - CI checks (always run, in parallel)
  # ============================================
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Format check
        run: yarn format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Lint
        run: yarn lint
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Typecheck
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Run tests
        run: yarn test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: flatoutsolutions/github-actions/setup@v1
        with:
          node-version: '24.x'
      - name: Build
        run: yarn build

  # ============================================
  # Phase II - Detect which components changed
  # ============================================
  detect-changes:
    needs: [format, lint, typecheck, test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mcp_server:
              - 'mcp_server/**'
              - 'plugin/**'
              - 'yarn.lock'

  # ============================================
  # Phase III - Release cccollab to npmjs.com
  # ============================================
  # Gating:
  #   * Phase I jobs must have succeeded (explicit result checks because the
  #     outer `!cancelled()` relaxes the default success requirement).
  #   * On workflow_dispatch: always release (manual trigger, no path filter).
  #   * On push to main: require mcp_server paths to have changed and skip
  #     the auto-bump commit.
  release-mcp:
    needs: [format, lint, typecheck, test, build, detect-changes]
    if: |
      !cancelled() &&
      needs.format.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.detect-changes.outputs.mcp_server == 'true' &&
          !startsWith(github.event.head_commit.message, 'chore: bump version to')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Get next version (from commits)
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        id: semver_auto
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor, docs, style, test, build, ci, chore, revert
          patchAll: true
          noVersionBumpBehavior: silent
          noNewCommitBehavior: silent

      - name: Resolve release version
        id: semver
        env:
          EXPLICIT_VERSION: ${{ inputs.version }}
          AUTO_STRICT: ${{ steps.semver_auto.outputs.nextStrict }}
          AUTO_TAG: ${{ steps.semver_auto.outputs.next }}
        run: |
          if [ -n "$EXPLICIT_VERSION" ]; then
            # Validate strict semver (x.y.z) to prevent injection and bad tags.
            if ! printf '%s' "$EXPLICIT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: $EXPLICIT_VERSION (expected strict semver X.Y.Z)" >&2
              exit 1
            fi
            echo "nextStrict=$EXPLICIT_VERSION" >> "$GITHUB_OUTPUT"
            echo "next=v$EXPLICIT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "nextStrict=$AUTO_STRICT" >> "$GITHUB_OUTPUT"
            echo "next=$AUTO_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.semver.outputs.nextStrict != ''
        run: yarn install --immutable

      - name: Build
        if: steps.semver.outputs.nextStrict != ''
        run: yarn workspace cccollab build

      - name: Update version in mcp_server/package.json and plugin.json
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
        # `JSON.stringify(_, null, 2)` always emits multi-line arrays, which
        # conflicts with Prettier's compact style for short arrays and breaks
        # the next non-skip CI run's `format:check`. Run prettier --write on
        # both files immediately after the rewrite to keep them conformant.
        run: |
          node -e "const fs=require('fs'); for (const f of ['./mcp_server/package.json','./plugin/.claude-plugin/plugin.json']) { const p=JSON.parse(fs.readFileSync(f,'utf8')); p.version=process.env.VERSION; fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n'); }"
          npx prettier --write mcp_server/package.json plugin/.claude-plugin/plugin.json

      - name: Publish
        if: steps.semver.outputs.nextStrict != ''
        working-directory: mcp_server
        run: npm publish
        env:
          # cccollab publishes to the public npmjs.com registry, not GitHub
          # Packages, because GitHub Packages requires an auth token even for
          # public packages — which would put a GitHub login in front of every
          # `npm i -g cccollab`. npmjs.com needs an explicit automation token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit, tag, and push
        if: steps.semver.outputs.nextStrict != ''
        env:
          VERSION: ${{ steps.semver.outputs.nextStrict }}
          TAG: ${{ steps.semver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mcp_server/package.json plugin/.claude-plugin/plugin.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git tag "${TAG}"
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.semver.outputs.nextStrict != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semver.outputs.next }}
        # Auto-generate notes from PRs and commits since the previous tag.
        # Idempotent on retry: if the release already exists (manual rerun
        # of this job after a tag was created in a prior partial run), skip
        # creation rather than failing the whole job.
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping."
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
